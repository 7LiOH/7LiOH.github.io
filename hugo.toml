baseURL = 'https://7LiOH.github.io/'
locale = 'en-us'
title = '7LiOH'
theme = "PaperMod"
defaultContentLanguage = 'zh'

[markup]
  [markup.goldmark]
    [markup.goldmark.renderHooks]
      [markup.goldmark.renderHooks.image]
        useEmbedded = 'fallback'
    [markup.goldmark.renderer]
      unsafe = true 
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['$$', '$$'], ['\\[', '\\]']]
          inline = [['$', '$'], ['\\(', '\\)']]
[params]
  ShowToc = true
  TocOpen = true
  ShowBreadCrumbs = true
  logoLink = "/posts/" 
  [params.profileMode]
    enabled = true
    title = "7LiOH"
    subtitle = "2Li + 2H2O = 2LiOH + H2↑"

[[menu.main]]
  name = "文章"
  url = "/posts/"
  weight = 1
[[menu.main]]
  name = "分类"
  url = "/tags/"
  weight = 2